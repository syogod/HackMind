id: web_app_adv_matrix
name: Advanced Web Exploitation Matrix
version: "1.2.0"
author: HackMind Security
description: >
  Exhaustive web vulnerability methodology covering modern infrastructure, 
  logic flaws, and advanced injection (CORS, Host Header, Race Conditions).
tier: asset

nodes:
  - id: web_tech_stack
    type: question
    title: What is the primary architecture of {{target_url}}?
    content: "Determine the infrastructure to load context-specific attack vectors."
    scope_tags: ["recon"]
    options:
      - key: cloud_hosted
        label: Cloud Hosted (AWS/GCP/Azure)
        children:
          - id: ssrf_cloud_metadata
            type: checklist
            title: Test SSRF targeting Cloud Metadata
            scope_tags: ["critical", "ssrf", "cloud"]
            content: |
              ### Cloud Metadata Exfiltration
              **AWS Metadata Payloads:**
              * `http://169.254.169.254/latest/meta-data/iam/security-credentials/`
              * `http://169.254.169.254/latest/dynamic/instance-identity/document`

              **Bypass Techniques:**
              * DNS Rebinding
              * Enclosed Alphanumeric (e.g., `http://①⑥⑨.②⑤④.①⑥⑨.②⑤④/...`)

      - key: traditional_on_prem
        label: Traditional / On-Premise
        children:
          - id: ssrf_internal_pivoting
            type: checklist
            title: Test SSRF for Internal Pivoting
            scope_tags: ["high", "ssrf", "network"]
            content: |
              ### Internal Network SSRF
              **Payloads:**
              * `http://127.0.0.1:80`
              * `http://localhost:6379` (Redis Dictator attacks)

  - id: web_frontend_routing
    type: question
    title: How does the application handle frontend rendering?
    scope_tags: ["recon"]
    options:
      - key: spa
        label: Single Page Application (React, Vue, Angular)
        children:
          - id: dom_xss_sinks
            type: checklist
            title: Audit DOM XSS Sources and Sinks
            scope_tags: ["high", "xss", "client-side"]
            content: |
              ### DOM-Based XSS
              **Common Sinks:** `innerHTML`, `document.write()`, `eval()`.
              **Sources:** `location.hash`, `location.search`, `window.name`.

      - key: ssr
        label: Server-Side Rendering (Next.js, Nuxt, traditional)
        children:
          - id: ssti_checks
            type: checklist
            title: Test for Server-Side Template Injection (SSTI)
            scope_tags: ["critical", "ssti", "rce"]
            content: |
              ### SSTI Identification
              Inject math evaluation probes:
              * `{{7*7}}` (Jinja2 / Twig)
              * `${7*7}` (FreeMarker / Velocity)
              * `<%= 7*7 %>` (ERB)

  - id: advanced_web_logic
    type: info
    title: "Advanced Logic & Protocol Attacks"
    content: "Testing for cache deception, request smuggling, and race conditions."
    children:
      - id: web_cache_deception
        type: checklist
        title: Test for Web Cache Deception / Poisoning
        scope_tags: ["high", "cache", "logic"]
        content: |
          1. Log in to `{{target_url}}`.
          2. Visit `GET /profile/nonexistent.css`
          3. Check if sensitive data is cached and accessible unauthenticated.

      - id: http_request_smuggling
        type: checklist
        title: HTTP Request Smuggling (CL.TE / TE.CL)
        scope_tags: ["critical", "smuggling", "advanced"]
        content: |
          Test for discrepancies in header parsing between front-end and back-end.

      - id: race_conditions
        type: checklist
        title: Test for Race Conditions
        scope_tags: ["high", "logic"]
        content: |
          ### Single-packet Attack (HTTP/2)
          Send multiple requests in a single TCP packet to bypass window-based protections.
          **Target Flows:** Funds transfer, coupon redemption, 2FA submission.

  - id: client_security_matrix
    type: info
    title: "Client-Side & Header Security"
    content: "CORS, Host Header, and PostMessage attacks."
    children:
      - id: cors_misconfig
        type: checklist
        title: Audit CORS Policy
        scope_tags: ["medium", "cors"]
        content: |
          - [ ] `Origin: https://attacker.com` -> `Access-Control-Allow-Origin: https://attacker.com`
          - [ ] `Origin: null` -> `Access-Control-Allow-Origin: null`
          - [ ] Check for regex flaws: `https://{{target_name}}.attacker.com`

      - id: host_header_injection
        type: checklist
        title: Host Header Injection
        scope_tags: ["medium", "host-header"]
        content: |
          - [ ] `Host: attacker.com` -> `Location: https://attacker.com/login` (Open Redirect)
          - [ ] Password Reset poisoning via Host header.

      - id: postmessage_vulnerabilities
        type: checklist
        title: Cross-Window Communication (PostMessage)
        scope_tags: ["high", "xss"]
        content: |
          - [ ] Missing origin validation in `window.addEventListener('message', ...)`
          - [ ] Sensitive data leakage via `postMessage`.
