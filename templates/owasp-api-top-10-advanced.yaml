name: "OWASP API Top 10 (Advanced)"
version: "1.2.0"
author: "HackMind"
tier: asset
description: >
  Exhaustive methodology for modern API security testing, 
  including specialized GraphQL and REST attack vectors.

nodes:
  - id: api_type_selection
    type: question
    title: Is this a REST or GraphQL API?
    scope_tags: ["recon"]
    options:
      - key: rest_api
        label: REST API
        children:
          - id: api_documentation
            type: checklist
            title: REST Documentation Analysis
            content: |
              - [ ] Locate Swagger/OpenAPI UI: `/swagger-ui.html`, `/api/docs`, `/v1/swagger.json`
              - [ ] Brute-force hidden endpoints with `kiterunner` or `ffuf`.
          - id: api_versioning
            type: checklist
            title: API Versioning & Unlisted Endpoints
            content: |
              - [ ] Test for older versions: `/v1/`, `/v0/`, `/beta/`
              - [ ] Check for non-documented HTTP methods (HEAD, OPTIONS, PUT).

      - key: graphql_api
        label: GraphQL API
        children:
          - id: graphql_introspection
            type: checklist
            title: GraphQL Introspection & Discovery
            scope_tags: ["medium", "graphql"]
            content: |
              ### GraphQL Introspection
              Send the introspection query to map the schema:
              `{"query": "{__schema{types{name fields{name}}}}"}`

              If disabled, use `clairvoyance` to brute-force the schema via suggestions.
          - id: graphql_dos
            type: checklist
            title: GraphQL Denial of Service
            scope_tags: ["high", "dos", "graphql"]
            content: |
              - [ ] **Batching Attack**: Send 100+ queries in a single array `[{query:...}, {query:...}]`.
              - [ ] **Alias Overload**: Brute-force credentials using 100 aliases for the same mutation.
              - [ ] **Circular/Deep Queries**: Nest objects to exhaust memory.

  - id: api_broken_auth
    type: info
    title: "2. Broken Authentication (API2)"
    content: "Testing for flaws in authentication mechanisms."
    children:
      - id: jwt_security
        type: checklist
        title: JWT Security
        content: |
          - [ ] Check for `none` algorithm support
          - [ ] Test for weak secret (brute-force with `jwt-tool`)
          - [ ] Check for `kid` injection (SQLi or Path Traversal)
          - [ ] Verify expiration (`exp` claim) enforcement

  - id: api_bola
    type: info
    title: "3. Broken Object Level Authorization (API1)"
    content: "Testing for IDOR-style flaws in resource access."
    children:
      - id: bola_resource_id
        type: checklist
        title: Resource ID Manipulation
        content: |
          - [ ] Replace `user_id` in `/api/users/{id}` with another user's ID
          - [ ] Test UUID vs Integer IDs (predictability)

  - id: api_injection
    type: info
    title: "4. API Injection (API8)"
    content: "Testing for classic and modern injection attacks."
    children:
      - id: api_sqli
        type: checklist
        title: SQL/NoSQL Injection
        content: |
          - [ ] Test JSON fields for SQLi: `{"id": "1' OR 1=1--"}`
          - [ ] Test MongoDB filters: `{"username": {"$ne": "guest"}}`
