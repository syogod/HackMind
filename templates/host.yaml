name: "Host"
version: "1.0.0"
author: "HackMind"
tier: asset
description: >
  Per-host attack methodology for a Windows or Linux server / workstation: local
  enumeration and situational awareness, local privilege escalation, on-host
  credential harvesting, lateral movement to other hosts, and local persistence.
  Domain-wide attacks live in the Domain Controller asset; network-position attacks
  live in the Internal Network asset.

nodes:
  - id: host_overview
    type: info
    title: "Host — orientation"
    content: |
      Point this asset at a single system you have (or are trying to get) access to.
      Start with situational awareness, escalate to local admin/root, harvest
      credentials, then use them to move laterally. Record OS, hostname, domain
      membership, and current privilege level.

  - id: q_host_os
    type: question
    title: "What operating system is this host?"
    options:
      - label: "Windows"
        key: "windows"
        children:
          - id: host_win_situational
            type: checklist
            title: "Windows situational awareness"
            content: |
              - whoami /all   (privileges and group memberships)
              - systeminfo     (OS version, patch level, hostname, domain)
              - ipconfig /all  (interfaces, DNS, domain)
              - netstat -ano ; tasklist   (connections, AV/EDR product)
              - net user ; net localgroup administrators
              - Check for AV/EDR before running tooling; note any application allow-listing.

          - id: host_win_privesc
            type: checklist
            title: "Windows local privilege escalation"
            content: |
              Automated:
              - winPEAS.exe / winpeasx64.exe ; PowerUp.ps1 (Invoke-AllChecks) ; Seatbelt.exe -group=all

              Manual:
              - Unquoted service paths: wmic service get name,pathname | findstr /i /v "C:\Windows"
              - Weak service permissions: accesschk.exe -uwcqv "Authenticated Users" *
              - AlwaysInstallElevated: reg query HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer
              - Scheduled tasks running as SYSTEM with a writable binary
              - DLL hijacking in writable PATH directories
              - Token privileges: whoami /priv -> SeImpersonate/SeAssign -> Potato attacks
                (PrintSpoofer, GodPotato), SeBackup/SeRestore -> SAM/SYSTEM copy

          - id: host_win_creds
            type: checklist
            title: "Windows credential harvesting"
            content: |
              Once local admin / SYSTEM:
              - LSASS dump (EDR permitting): comsvcs MiniDump, procdump, nanodump, direct syscalls
                -> mimikatz sekurlsa::logonpasswords / pypykatz
              - SAM + SYSTEM: reg save, then impacket-secretsdump -sam SAM -system SYSTEM LOCAL
              - DPAPI secrets, Credential Manager, browser saved passwords (SharpChrome)
              - Files: unattend.xml, sysprep.inf, web.config, *.kdbx, PowerShell history, scripts
              - LSA secrets / cached domain creds (mscash) for offline cracking (-m 2100)

          - id: host_win_persistence
            type: checklist
            title: "Windows persistence (if in scope)"
            content: |
              Only if authorised — document for cleanup:
              - Registry Run key, scheduled task, new service
              - WMI event subscription, COM hijack, startup folder
              - Local admin account creation (record and remove at the end)

      - label: "Linux"
        key: "linux"
        children:
          - id: host_lin_situational
            type: checklist
            title: "Linux situational awareness"
            content: |
              - id ; whoami ; hostname ; uname -a
              - sudo -l   (allowed sudo commands)
              - cat /etc/passwd ; ls -la /home/*
              - ip a ; netstat -tulpn / ss -tulpn
              - ps aux ; crontab -l ; ls -la /etc/cron*

          - id: host_lin_privesc
            type: checklist
            title: "Linux local privilege escalation"
            content: |
              Automated: linpeas.sh ; LinEnum.sh ; pspy (watch cron/processes)

              Manual:
              - sudo -l -> GTFOBins for any allowed binary; sudo CVEs (Baron Samedit CVE-2021-3156)
              - SUID/SGID: find / -perm -4000 -type f 2>/dev/null -> GTFOBins
              - Writable cron jobs / PATH hijack in root-run scripts
              - Capabilities: getcap -r / 2>/dev/null (cap_setuid, etc.)
              - Writable /etc/passwd or /etc/shadow; weak service running as root
              - Kernel exploits (match uname -a) — DirtyPipe (CVE-2022-0847), PwnKit (CVE-2021-4034)
              - Docker/lxd group membership -> container escape to root

          - id: host_lin_creds
            type: checklist
            title: "Linux credential harvesting"
            content: |
              - /etc/shadow (if readable) -> hashcat -m 1800
              - SSH private keys: ~/.ssh/id_*, known_hosts (lateral targets), authorized_keys
              - History & configs: ~/.bash_history, .env, config files, DB connection strings
              - Cloud creds: ~/.aws/credentials, ~/.config/gcloud, instance metadata
              - Cached Kerberos tickets (/tmp/krb5cc_*) if domain-joined

          - id: host_lin_persistence
            type: checklist
            title: "Linux persistence (if in scope)"
            content: |
              Only if authorised — document for cleanup:
              - Add SSH key to authorized_keys ; cron job ; systemd service/timer
              - SUID backdoor ; new privileged user
              - Record every change for removal at engagement end.

  - id: host_lateral
    type: checklist
    title: "Lateral movement to other hosts"
    content: |
      Use harvested credentials/hashes to reach other systems (add each as its own Host):
      Windows:
      - Pass-the-Hash: crackmapexec smb <targets> -u <user> -H <NTLM>
      - Execution: impacket-psexec / smbexec / atexec / wmiexec ; evil-winrm -i <IP> -u <user> -p <pass>
      - crackmapexec smb <IP> -u <user> -p <pass> -x "whoami" ; --wmi for WMI
      - Pass-the-Ticket: Rubeus ptt /ticket:<b64> ; KRB5CCNAME=ticket.ccache <tool>
      - DCOM (MMC20, ShellWindows) ; RDP /restrictedadmin with a hash
      Linux:
      - SSH with discovered keys/passwords ; reuse creds across hosts
      Test every discovered credential against every reachable service (credential reuse
      is one of the most reliable internal wins).

  - id: host_evidence
    type: checklist
    title: "Capture evidence"
    content: |
      - Screenshot whoami / id showing elevated context with hostname + timestamp
      - Note the privesc/lateral technique used and any credentials obtained (hashes only)
      - Record the host in the engagement inventory and link findings back to the report.
